[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
# E/W: style errors, F: real bugs (unused names), I: import order, B: common bug patterns, UP: modern Python syntax
select = ["E", "F", "W", "I", "B", "UP"]

[tool.mypy]
python_version = "3.11"
files = ["etf_analytics"]
ignore_missing_imports = true
disallow_untyped_defs = true