name: daily-update

on:
  schedule:
    # 23:00 UTC, Monday to Friday: after the TSX and NYSE close (4 p.m. ET)
    # and after the Bank of Canada publishes its rate (4:30 p.m. ET), in both EST and EDT.
    - cron: "0 23 * * 1-5"
  workflow_dispatch: # also allow a manual run from the Actions tab

permissions:
  contents: write # push the updated report
  issues: write # open an issue when the run fails

concurrency:
  group: daily-update # never run two updates at the same time
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      # The database is not in git. Restore the latest copy from the Actions cache.
      # If there is none (first run, or the cache expired), fetch downloads everything again.
      - name: Restore database
        uses: actions/cache/restore@v6
        with:
          path: data/etf.db
          key: etf-db-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: etf-db-

      - name: Fetch new data
        run: |
          for attempt in 1 2 3; do
            python -m etf_analytics.fetch && exit 0
            echo "Attempt $attempt failed, retrying in 60 seconds"
            sleep 60
          done
          exit 1

      - name: Validate data
        run: python -m etf_analytics.validate

      - name: Build report
        run: python -m etf_analytics.report

      # Saved only if every step above passed, so bad data is never kept.
      - name: Save database
        uses: actions/cache/save@v6
        with:
          path: data/etf.db
          key: etf-db-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Commit report
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add reports/
          if git diff --cached --quiet; then
            echo "Report unchanged"
          else
            git commit -m "Update daily report for $(date -u +%Y-%m-%d)"
            git pull --rebase  # in case main changed while this run was going
            git push
          fi

      - name: Open an issue on failure
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          title="Daily update failed"
          existing=$(gh issue list --state open --search "\"$title\" in:title" --json number --jq '.[0].number')
          if [ -n "$existing" ]; then
            gh issue comment "$existing" --body "Failed again on $(date -u +%Y-%m-%d): $RUN_URL"
          else
            gh issue create --title "$title" --body "The daily update failed on $(date -u +%Y-%m-%d). Nothing was committed and the database cache was not updated. Logs: $RUN_URL"
          fi